name: Attribution list consumer
on:
  pull_request:
    paths:
      - 'auditctl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/attribution-list.yml'
permissions:
  contents: read
jobs:
  installed-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bayleafwalker/agentops
          ref: 7b5c02a14bee88e7c19ed81f4f510800c0160a8c
          path: agentops-query
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and normally install candidate wheel
        run: |
          python -m pip install build pytest
          python -m build --wheel --outdir candidate-dist
          python -m pip install candidate-dist/*.whl
          python -m pip check
      - name: Verify installed consumer outside repository imports
        env:
          AUDITCTL_TEST_ATTRIBUTION_QUERY: ${{ github.workspace }}/agentops-query/scripts/query_audit_attribution.py
        run: |
          target="$RUNNER_TEMP/installed-audit-consumer"
          mkdir -p "$target"
          cp tests/test_attribution_listing.py tests/test_cli.py tests/conftest.py "$target/"
          cd "$target"
          python -c 'import auditctl; from pathlib import Path; assert "site-packages" in Path(auditctl.__file__).parts; print(auditctl.__file__)'
          python -m pytest -q .
