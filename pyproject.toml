[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditctl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
auditctl = "auditctl.cli:cli"
auditctl-central-schema = "auditctl.central_schema:main"

[project.optional-dependencies]
central = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["auditctl*"]

[tool.setuptools.package-data]
"auditctl.central_migrations" = ["versions/*.sql"]
